name: AGI concept learner tests

on:
  push:
    branches: [main]
    paths:
      - "agi/**"
      - "Fold/**"
      - "*.lean"
      - "lakefile.lean"
      - "lean-toolchain"
      - ".github/workflows/agi-concepts.yml"
  pull_request:
    paths:
      - "agi/**"
      - ".github/workflows/agi-concepts.yml"

jobs:
  concept-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test concept learner, quantity proposer, relational discovery, composition, independent validation, model comparison, three-way evaluation, active experiment design, evidence-driven revision, representation transfer, compositional abstraction, invariant discovery, affine relationship discovery, finite affine group recognition, finite symmetry actions, orbit quotient spaces, structure-preserving operation descent, and restricted fixed-width 3-colouring
        run: python -m unittest agi.test_concept_learner agi.test_concept_proposer agi.test_relation_discovery agi.test_relation_composition agi.test_relation_validation agi.test_relation_selection agi.test_three_way_evaluation agi.test_active_experiment agi.test_evidence_revision agi.test_representation_transfer agi.test_compositional_abstraction agi.test_invariant_discovery agi.test_affine_relationships agi.test_affine_group agi.test_symmetry_actions agi.test_quotient_spaces agi.test_structure_descent agi.test_restricted_three_colouring -v
      - name: Run learner self-test
        run: python agi/concept_learner.py

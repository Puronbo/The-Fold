name: Fold AI prototypes

on:
  push:
    branches:
      - "foldproof/**"
  pull_request:
    paths:
      - "tools/FoldConcept.py"
      - "tools/FoldLoop.py"
      - "tools/FoldMemory.py"
      - "tools/FoldMind.py"
      - "tools/FoldHypothesis.py"
      - "tools/FoldExperiment.py"
      - "tools/FoldEnvironment.py"
      - "tools/FoldAgent.py"
      - "tools/FoldRetention.py"
      - "tests/test_fold_retention.py"
      - ".github/workflows/fold-ai-prototypes.yml"

jobs:
  prototype-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test concept learner
        run: python tools/FoldConcept.py
      - name: Test feedback loop
        run: python tools/FoldLoop.py
      - name: Test append-only memory
        run: python tools/FoldMemory.py
      - name: Test integrated FoldMind hypothesis and experiment cycle
        run: python tools/FoldMind.py
      - name: Test hypothesis generation, falsification, and memory audit
        run: python tools/FoldHypothesis.py
      - name: Test disagreement-based experiment selection
        run: python tools/FoldExperiment.py
      - name: Test approval-gated environment interaction
        run: python tools/FoldEnvironment.py
      - name: Test goal-directed Fold controller
        run: python tools/FoldAgent.py
      - name: Test minimum sufficient retained memory
        run: python tools/FoldRetention.py
      - name: Test retained-memory unit cases
        run: python -m unittest discover -s tests -p "test_fold_retention.py"

name: Python spectral engine tests

on:
  pull_request:
    paths:
      - "agi/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/python-tests.yml"
  push:
    branches:
      - main
      - research/cyclotomic-eigenprimes

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run existing unit tests
        run: python -m unittest discover -s tests -v
      - name: Run AGI concept learner tests
        run: python -m unittest agi.test_concept_learner agi.test_concept_proposer -v
